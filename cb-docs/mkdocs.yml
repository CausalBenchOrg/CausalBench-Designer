site_name: CausalBench
site_description: Documentation for reproducible causal-learning benchmarks with CausalBench
site_author: CausalBench Team
site_url: https://docs.causalbench.org/

repo_name: CausalBenchOrg/CausalBench-Docs
repo_url: https://github.com/CausalBenchOrg/CausalBench-Docs
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Get started:
      - Installation: install.md
      - Run your first benchmark: quickstart.md
  - Learn:
      - Core concepts: concepts.md
      - Contexts and runs: contexts.md
      - Causal-discovery benchmarks: causal-discovery.md
      - Reproducible experiments: reproducibility.md
      - Glossary: basics.md
  - Build components:
      - Dataset packages: modules/datasets.md
      - Models and metrics: modules/models-metrics.md
      - Tasks and data contracts: modules/tasks.md
  - Reference:
      - Python API: api.md
      - Troubleshooting: troubleshooting.md
  - Research: papers.md
  - Licensing and terms: terms.md

theme:
  name: mkdocs
  highlightjs: true
  hljs_languages:
    - bash
    - python
    - yaml
  color_mode: auto
  user_color_mode_toggle: true
  navigation_depth: 3

extra_css:
  - stylesheets/tables.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true

strict: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn

copyright: CausalBench Python software is licensed under Apache License 2.0; contributed artifacts may use different terms.
