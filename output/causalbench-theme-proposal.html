<div id="cb-theme-proposal" class="viz-dotted-background">
  <style>
    #cb-theme-proposal { padding: 16px 0; }
    #cb-theme-proposal .cb-preview {
      --cb-page: #f8fafc; --cb-surface: #ffffff; --cb-sunken: #f1f5f9;
      --cb-text: #0f172a; --cb-muted: #475569; --cb-border: #e2e8f0;
      --cb-primary: #047857; --cb-on-primary: #ffffff; --cb-soft: #ecfdf5;
      --cb-link: #047857; --cb-focus: #10b981;
      --cb-success: #15803d; --cb-success-soft: #dcfce7;
      --cb-warning: #b45309; --cb-warning-soft: #fef3c7;
      color-scheme: light;
      font: 14px/1.5 Arial, sans-serif;
      color: var(--cb-text); background: var(--cb-page);
      border: 1px solid var(--cb-border); border-radius: 12px;
      overflow-wrap: anywhere;
    }
    #cb-theme-proposal .cb-preview[data-theme="dark"] {
      --cb-page: #020617; --cb-surface: #0f172a; --cb-sunken: #1e293b;
      --cb-text: #f8fafc; --cb-muted: #cbd5e1; --cb-border: #334155;
      --cb-primary: #34d399; --cb-on-primary: #020617; --cb-soft: #022c22;
      --cb-link: #6ee7b7;
      --cb-success: #4ade80; --cb-success-soft: #14532d;
      --cb-warning: #fbbf24; --cb-warning-soft: #78350f;
      color-scheme: dark;
    }
    #cb-theme-proposal .cb-header { padding: 20px 22px; border-bottom: 1px solid var(--cb-border); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
    #cb-theme-proposal .cb-title { font-size: 18px; font-weight: 600; }
    #cb-theme-proposal .cb-secondary { color: var(--cb-muted); }
    #cb-theme-proposal .cb-theme-switch { display: flex; gap: 4px; padding: 4px; background: var(--cb-sunken); border-radius: 8px; }
    #cb-theme-proposal button { font: inherit; border-radius: 6px; padding: 8px 12px; border: 1px solid var(--cb-border); background: var(--cb-surface); color: var(--cb-text); }
    #cb-theme-proposal .cb-theme-switch button { border-color: transparent; background: transparent; }
    #cb-theme-proposal .cb-theme-switch button[aria-pressed="true"] { color: var(--cb-primary); background: var(--cb-soft); }
    #cb-theme-proposal .cb-content { padding: 22px; display: grid; gap: 18px; }
    #cb-theme-proposal .cb-tabs { display: flex; flex-wrap: wrap; gap: 18px; border-bottom: 1px solid var(--cb-border); color: var(--cb-muted); }
    #cb-theme-proposal .cb-tab { padding-bottom: 10px; }
    #cb-theme-proposal .cb-tab-current { color: var(--cb-primary); border-bottom: 2px solid var(--cb-primary); font-weight: 600; }
    #cb-theme-proposal .cb-field-label { display: block; margin-bottom: 7px; font-weight: 600; }
    #cb-theme-proposal input { box-sizing: border-box; display: block; width: 100%; min-width: 0; padding: 10px 12px; border: 1px solid var(--cb-border); border-radius: 6px; background: var(--cb-surface); color: var(--cb-text); font: inherit; }
    #cb-theme-proposal .cb-module { background: var(--cb-surface); border: 1px solid var(--cb-border); border-radius: 8px; padding: 16px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 14px; }
    #cb-theme-proposal .cb-module-name { font-weight: 600; margin-bottom: 3px; }
    #cb-theme-proposal .cb-link { color: var(--cb-link); font-weight: 600; }
    #cb-theme-proposal .cb-statuses { display: flex; flex-wrap: wrap; gap: 8px; }
    #cb-theme-proposal .cb-status { padding: 5px 9px; border-radius: 5px; font-size: 12px; }
    #cb-theme-proposal .cb-success { color: var(--cb-success); background: var(--cb-success-soft); }
    #cb-theme-proposal .cb-warning { color: var(--cb-warning); background: var(--cb-warning-soft); }
    #cb-theme-proposal .cb-footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
    #cb-theme-proposal .cb-primary { background: var(--cb-primary); color: var(--cb-on-primary); border-color: var(--cb-primary); font-weight: 600; }
    #cb-theme-proposal .cb-swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: var(--cb-primary); vertical-align: -1px; margin-right: 6px; }
    #cb-theme-proposal .cb-palette-label { font-size: 12px; color: var(--cb-muted); }
    #cb-theme-proposal .cb-status-samples { font-size: 12px; color: var(--cb-muted); margin-bottom: 6px; }
    @media (max-width: 420px) {
      #cb-theme-proposal .cb-header, #cb-theme-proposal .cb-content { padding: 16px; }
      #cb-theme-proposal .cb-theme-switch button { min-height: 44px; }
    }
  </style>
  <section class="cb-preview" data-theme="light" aria-label="Proposed CausalBench Designer colors">
    <header class="cb-header">
      <div><div class="cb-title">Context Designer</div><div class="cb-secondary">Tuning PC</div></div>
      <div class="cb-theme-switch" role="group" aria-label="Preview color theme">
        <button type="button" class="cursor-interaction" data-theme-choice="light" aria-pressed="true">Light</button>
        <button type="button" class="cursor-interaction" data-theme-choice="dark" aria-pressed="false">Dark</button>
      </div>
    </header>
    <div class="cb-content">
      <div class="cb-tabs" aria-label="Context steps"><span class="cb-tab">Task</span><span class="cb-tab">Datasets</span><span class="cb-tab cb-tab-current">Models</span><span class="cb-tab">Metrics</span></div>
      <label><span class="cb-field-label">Context name</span><input value="Tuning PC" readonly aria-label="Example context name"></label>
      <div class="cb-module">
        <div><div class="cb-module-name">pc</div><div class="cb-secondary">Registry #3 · version 1</div></div>
        <span class="cb-link">Configure model</span>
      </div>
      <div><div class="cb-status-samples">Status colors</div><div class="cb-statuses"><span class="cb-status cb-success">✓ Metadata complete</span><span class="cb-status cb-warning">Metadata needs review</span></div></div>
      <div class="cb-footer">
        <span class="cb-palette-label"><span class="cb-swatch"></span>Emerald accent <span data-accent-code>#047857</span></span>
        <button type="button" class="cb-primary" disabled>Review &amp; export</button>
      </div>
    </div>
  </section>
  <script>
    (() => {
      const root = document.getElementById('cb-theme-proposal');
      const preview = root.querySelector('.cb-preview');
      const choices = root.querySelectorAll('[data-theme-choice]');
      function render(theme) {
        const selected = theme === 'dark' ? 'dark' : 'light';
        preview.dataset.theme = selected;
        choices.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.themeChoice === selected)));
        root.querySelector('[data-accent-code]').textContent = selected === 'dark' ? '#34d399' : '#047857';
      }
      render(window.openai?.widgetState?.privateContent?.theme || 'light');
      choices.forEach(button => button.addEventListener('click', () => {
        const theme = button.dataset.themeChoice;
        render(theme);
        window.openai?.setWidgetState?.({ modelContent: { previewTheme: theme }, privateContent: { theme } })?.catch(() => {});
      }));
      window.addEventListener('openai:set_globals', event => {
        const theme = event.detail?.globals?.widgetState?.privateContent?.theme;
        if (theme) render(theme);
      });
    })();
  </script>
</div>
